spring.application.name=sudoku
# --- Shared by all profiles ---
# Keycloak realm; the default matches the dev Keycloak in docker-compose
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH2_ISSUER_URI:http://localhost:8180/realms/sudoku}
# Schema is owned by Flyway (db/migration); Hibernate only checks it matches
spring.jpa.hibernate.ddl-auto=validate
# Fail fast instead of hanging request threads when Redis is unreachable
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s
# Behind a reverse proxy, take the client IP from X-Forwarded-For. Tomcat only trusts the header
# when the direct peer is a private/loopback address (its default internal proxies), so clients
# on the internet can't spoof it.
server.forward-headers-strategy=native
# Per client (user, or IP when anonymous) per minute. Anonymous players behind carrier NAT
# share an IP, so the puzzle limit leaves room for several of them.
sudoku.rate-limit.puzzles-per-minute=120
sudoku.rate-limit.submits-per-minute=20
# How long a puzzle can be scored after it was handed out: long enough for a slow solve or a
# paused game. Unsubmitted puzzles stay in Redis this long (a few hundred bytes each), so the
# worst case per client is puzzles-per-minute x this TTL.
sudoku.puzzle-ttl=24h
