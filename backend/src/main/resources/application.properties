spring.application.name=sudoku
# --- Shared by all profiles; prod overrides the issuer ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH2_ISSUER_URI:http://localhost:8080/realms/sudoku}
# Schema is owned by Flyway (db/migration); Hibernate only checks it matches
spring.jpa.hibernate.ddl-auto=validate
# Fail fast instead of hanging request threads when Redis is unreachable
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s
# Per client (user, or IP when anonymous) per minute
sudoku.rate-limit.puzzles-per-minute=30
sudoku.rate-limit.submits-per-minute=20
