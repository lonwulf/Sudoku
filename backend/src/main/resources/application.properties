spring.application.name=sudoku
# --- Shared by all profiles; prod overrides the issuer ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH2_ISSUER_URI:http://localhost:8080/realms/sudoku}
# Schema is owned by Flyway (db/migration); Hibernate only checks it matches
spring.jpa.hibernate.ddl-auto=validate
